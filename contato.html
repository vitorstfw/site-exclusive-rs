<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Exclusive RS</title>
   <link rel="stylesheet" href="css/contato.css">
</head>
<body>
    <section class="banner-contato">
<h1>Fale conosco</h1>
<p>Solicite um orçamento personalizado</p>
    </section>

    <section class="contato-container">

        <div class="info-contato">
            <h2>Informaçoes</h2>

            <div class="item">
                📱WhatsApp
            
                <span>(12) 99999-9999</span>
            </div>

            <div class="item">
                📩E-mail
                <span>contato@exclusivers.com.br</span>
            </div>

            <div class="item">
                📍Endereço
                <span>Sua Cidade - Estado</span>
            </div>
        </div>

        <div class="formulario">
            <h2>Solicite um orçamento</h2>

            <form action="contato" id="formContato">

                <input type="text" placeholder="Seu Nome" required>

                <input type="email" placeholder="Seu e-mail" required>

                <input type="tel" placeholder="Seu Telefone">

                <select>
                    <option>Selecione o produto</option>
                    <option>Canecas</option>
                    <option>Camisetas</option>
                    <option>Mochilas</option>
                    <option>Brindes Empresariais</option>
                </select>

                <textarea placeholder="Descreva seu pedido"></textarea>

                <button type="submit">
                    Enviar Solicitação
                </button>
            </form>
        </div>
    </section>

    <script src="js/contato.js"></script>
</body>
</html>
